# Multi-Teacher PAT-Attn (Method D): Attention-Based Teacher Fusion
# Cross-attention: student RAA = Query, teacher AFP features = Keys/Values.
# L = L_CE + α·L_KL^attn + β·L_FD^attn + γ·(1/K)·Σ L_Reg_k + λ_e·L_entropy
#
# Teachers: DenseNet-121 (384d), ResNet-50 (2048d), ViT-Base (768d)
# Student:  MobileNetV2

# Data configuration
data:
  data_dir: "./data"
  batch_size: 48
  num_workers: 4
  val_size: 5000
  seed: 42
  pre_trained: false
  teacher_model_types: ["densenet", "resnet", "vit"]
  student_model_type: "mobilenet"

# Model configuration
model:
  num_classes: 100
  student_name: "mobilenetv2_100"
  student_pretrained: false
  teacher_names:
    - "densenet121_cifar100"
    - "resnet50_cifar100"
    - "vit"

# Knowledge Distillation configuration
kd:
  type: "multi_pat_attn"
  temperature: 4.0
  learning_rate: 0.001
  num_classes: 100
  # PAT loss weights
  alpha: 1.0
  beta: 1.5
  gamma: 0.1
  # Architecture
  student_channels: [24, 32, 96, 1280]
  teacher_feature_dims: [384, 2048, 768]
  embed_dim: 256
  num_heads: 8
  # Attention fusion params
  attn_dim: 256
  attn_heads: 1               # Only 3 teacher keys → 4 heads causes instability; 1 head is sufficient
  entropy_weight: 0.1         # Increased from 0.01 to strongly prevent attention collapse

# Training configuration
training:
  max_epochs: 300
  patience: 50
  log_every_n_steps: 50

# Weights & Biases configuration
wandb:
  project: "KD-CIFAR100"
  name: "MultiPAT-Attn-3T"
  log_model: "all"
  resume: "allow"
