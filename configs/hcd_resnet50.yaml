# HCD: Heterogeneous Complementary Distillation with ResNet-50 Teacher
# Official implementation: https://github.com/yema-web/HCD
# Reference: Xu et al. "Heterogeneous Complementary Distillation" arXiv:2511.10942

# Data configuration
data:
  data_dir: "./data"
  batch_size: 128
  num_workers: 4
  val_size: 5000
  seed: 42
  pre_trained: false
  teacher_model_types: ["resnet"]
  student_model_type: "mobilenet"

# Model configuration
model:
  num_classes: 100
  student_name: "mobilenetv2_100"
  student_pretrained: false
  teacher_names:
    - "resnet50_cifar100"

# Knowledge Distillation configuration (matching official defaults)
kd:
  type: "hcd"
  temperature: 1.0             # ofa_temperature in official
  learning_rate: 0.05          # SGD lr in official
  num_classes: 100
  # HCD-specific parameters (matching official paper Table 7)
  hcd_loss_weight: 6.0         # λ: Weight for HCD KL loss
  kd_loss_weight: 1.0          # β: Weight for standard KD loss (student vs teacher)
  gt_loss_weight: 1.0          # Weight for CE losses
  diversity: 1.0               # ω: Weight for orthogonality loss
  label_smoothing: 0.1         # Label smoothing (official uses 0.1)
  k: 4                         # Number of sub-logits (hardcoded in official)
  ortho_threshold: 0.5         # Orthogonality threshold
  lambda_student: 1.0          # Sub-logit weight in fusion
  lambda_teacher: 1.0          # Teacher logit weight in fusion
  student_channels: [24, 32, 96, 1280]  # MobileNetV2 real intermediate channels
  student_final_dim: 1280
  teacher_feature_dim: 2048    # ResNet-50 feature dim
  embed_dim: 2048              # max(student_final_dim, teacher_feature_dim)

# Training configuration (matching official: 300 epochs)
training:
  max_epochs: 300
  patience: 50
  log_every_n_steps: 50

# Weights & Biases configuration
wandb:
  project: "KD-CIFAR100"
  name: "HCD-ResNet50-v2"
  log_model: false
  resume: "allow"
