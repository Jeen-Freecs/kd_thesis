# Multi-Teacher PAT-CW (Method B): Confidence-Weighted
# Extends PAT-Ind with CA-WKD per-sample teacher weighting.
# L = L_CE + Σ_k w̄_k [α·L_KL_k + β·L_FD_k + γ·L_Reg_k]
# where w_k = (1/(K-1)) * (1 - exp(CE_k) / Σ_j exp(CE_j))
#
# Teachers: DenseNet-121 (384d), ResNet-50 (2048d), ViT-Base (768d)
# Student:  MobileNetV2

# Data configuration
data:
  data_dir: "./data"
  batch_size: 48
  num_workers: 4
  val_size: 5000
  seed: 42
  pre_trained: false
  teacher_model_types: ["densenet", "resnet", "vit"]
  student_model_type: "mobilenet"

# Model configuration
model:
  num_classes: 100
  student_name: "mobilenetv2_100"
  student_pretrained: false
  teacher_names:
    - "densenet121_cifar100"
    - "resnet50_cifar100"
    - "vit"

# Knowledge Distillation configuration
kd:
  type: "multi_pat_cw"
  temperature: 4.0
  learning_rate: 0.001
  num_classes: 100
  # PAT loss weights
  alpha: 1.0
  beta: 1.5
  gamma: 0.1
  # Architecture
  student_channels: [24, 32, 96, 1280]
  teacher_feature_dims: [384, 2048, 768]
  embed_dim: 256
  num_heads: 8

# Training configuration
training:
  max_epochs: 300
  patience: 50
  log_every_n_steps: 50

# Weights & Biases configuration
wandb:
  project: "KD-CIFAR100"
  name: "MultiPAT-CW-3T"
  log_model: false
  resume: "allow"
